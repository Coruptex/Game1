# PrusaSlicer profile used ONLY to estimate print time and filament.
# It mirrors the published Bambu Lab A1 "0.20mm Standard" process and
# "Bambu PLA Basic" filament limits (speeds, accelerations, 21 mm3/s flow),
# but it is not Bambu Studio: expect Bambu Studio's estimate to differ.
printer_technology = FFF
gcode_flavor = marlin2
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_density = 1.24
filament_cost = 20
filament_max_volumetric_speed = 21
max_volumetric_speed = 21
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = grid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
extrusion_width = 0.42
first_layer_extrusion_width = 0.5
external_perimeter_speed = 200
perimeter_speed = 300
infill_speed = 270
solid_infill_speed = 250
top_solid_infill_speed = 200
gap_fill_speed = 250
bridge_speed = 50
first_layer_speed = 50
first_layer_infill_speed = 105
small_perimeter_speed = 50%
travel_speed = 500
default_acceleration = 6000
external_perimeter_acceleration = 5000
perimeter_acceleration = 6000
infill_acceleration = 10000
solid_infill_acceleration = 6000
top_solid_infill_acceleration = 2000
bridge_acceleration = 3000
first_layer_acceleration = 500
travel_acceleration = 10000
machine_limits_usage = time_estimate_only
machine_max_acceleration_x = 12000
machine_max_acceleration_y = 12000
machine_max_acceleration_z = 1500
machine_max_acceleration_e = 5000
machine_max_acceleration_extruding = 12000
machine_max_acceleration_retracting = 5000
machine_max_acceleration_travel = 12000
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 30
machine_max_feedrate_e = 120
machine_max_jerk_x = 9
machine_max_jerk_y = 9
machine_max_jerk_z = 3
machine_max_jerk_e = 3
cooling = 1
fan_always_on = 1
slowdown_below_layer_time = 6
min_print_speed = 20
support_material = 0
skirts = 0
retract_length = 0.8
retract_speed = 30
retract_lift = 0.4
avoid_crossing_perimeters = 0
