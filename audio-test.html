<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Test — Ember of Retribution (dev)</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0b1a22; color: #e9e1d2; font: 14px/1.4 system-ui, sans-serif; }
      #app { max-width: 1100px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; color: #ffcf8a; }
      h3 { margin: 0 0 8px; font-size: 14px; color: #ffcf8a; text-transform: uppercase; letter-spacing: 0.08em; }
      .status { font: 12px monospace; color: #9fc3cf; margin-bottom: 10px; }
      .panel { background: #12262f; border: 1px solid #23414d; border-radius: 8px; padding: 12px; margin: 10px 0; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
      button { background: #1d3a46; color: #f3ead9; border: 1px solid #335a69; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
      button:hover { background: #26505f; }
      button.primary { background: #a4561b; border-color: #d8873f; }
      select { background: #1d3a46; color: #f3ead9; border: 1px solid #335a69; border-radius: 6px; padding: 5px; }
      .slider { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
      .slider .lbl { width: 90px; }
      .slider input[type='range'] { flex: 1; }
      .slider .val { width: 40px; text-align: right; font: 12px monospace; }
      table { border-collapse: collapse; width: 100%; font: 12px monospace; }
      th, td { padding: 3px 6px; border-bottom: 1px solid #23414d; text-align: left; }
      tr.bad td { color: #ff7a6a; }
      canvas { background: #0b1a22; border-radius: 3px; }
      @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/audio/dev/audioTestPage.ts"></script>
  </body>
</html>
